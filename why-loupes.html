<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

<body>
  <script src="js/config.js"></script>

  <script src="js/app.js"></script>
  <script>
    LimaUI.mountShell("why");
    document.getElementById("app-main").innerHTML = `
      <div class="wrap page-head">
        <span class="eyebrow">Clinical rationale</span>
        <h1>Why surgical loupes are used</h1>
        <p class="lead">A loupe is a binocular magnifier worn on a spectacle frame. It does two jobs at once: it enlarges the operating field, and — especially with angled or TTL designs — it lets the clinician keep a more neutral neck while still looking into a mouth, ear, or incision.</p>
      </div>
      <section class="section">
        <div class="wrap grid">
          <article class="panel">
            <h3>1. Detail that unaided vision misses</h3>
            <p>Enamel–dentin junctions, hairline fractures, canal orifices, implant threads, and microsutures sit at the edge of what a 40-year-old eye can resolve under operatory light. 2.5X–3.5X is the usual first step; 4X–6X is chosen when the work is endodontic, implant, or microsurgical.</p>
          </article>
          <article class="panel">
            <h3>2. Posture and career length</h3>
            <p>Without magnification, operators drop the head to get closer. Cervical and shoulder fatigue follow. Angled (“no stooping”) loupes in this catalogue deflect the optical path so the eyes look down while the neck stays closer to upright — the reason dentists buy a second pair after years of standard Galilean frames.</p>
          </article>
          <article class="panel">
            <h3>3. Light that follows the eyes</h3>
            <p>The operator’s own head shadows the field. A 3W (30 000 lux) or 5W (15 000–30 000 lux) loupe LED sits on the frame so illumination is coaxial with the line of sight. That is why lights are sold as attachments for every loupe family here.</p>
          </article>
        </div>
      </section>
      <section class="section">
        <div class="wrap split">
          <div class="panel">
            <h2>How to choose magnification</h2>
            <ul class="ticks">
              <li><strong>2.5X</strong> — wide field, easiest fusion, first pair for general dentistry and diagnosis.</li>
              <li><strong>3.5X</strong> — tighter restorative and surgical detail, still a 120 mm field on the premium pair.</li>
              <li><strong>4X</strong> — angled work with a usable field for mixed dental and ENT lists.</li>
              <li><strong>5X</strong> — implant, RCT, and precision observation; 73 mm field on the 5X angular model.</li>
              <li><strong>6X</strong> — finest detail; narrower field; best when you already work comfortably at 5X.</li>
            </ul>
          </div>
          <div class="panel">
            <h2>Frame types in this catalogue</h2>
            <ul class="ticks">
              <li><strong>Glasses-type / flip-style</strong> — daily wear, six colours, 4X–6X, myopia-compatible.</li>
              <li><strong>Angled binocular</strong> — reduced bowing; implant and root-canal geometry.</li>
              <li><strong>Magnetic interchangeable</strong> — one chassis, 4X/5X/6X barrels, presbyopia-friendly.</li>
              <li><strong>Embedded TTL</strong> — titanium, custom pupil distance, 2.5X or 3.5X.</li>
            </ul>
            <p>Working distances in the sheets are typically 350–450 mm or 420–550 mm. Pupil distance is either adjustable (52–76 mm) or customised on TTL. We confirm your PD and preferred working distance on WhatsApp before a pre-order is packed.</p>
          </div>
        </div>
      </section>
    `;
